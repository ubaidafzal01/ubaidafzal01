  <g>
    <rect x="612.75" y=".75" width="280.5" height="148.5" rx="26" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
    <circle cx="854" cy="26" r="70" fill="#ede9fe" opacity=".9" clip-path="url(#c2)"/>
    <rect x="612" y="0" width="282" height="75.0" rx="26" fill="url(#sheen)" opacity=".7"/>
    <text x="753.0" y="80" text-anchor="middle" class="n" fill="#7c3aed">150+</text>
    <text x="753.0" y="110" text-anchor="middle" class="l">Problems solved</text>
    <rect x="702" y="128" width="102" height="5" rx="2.5" fill="#7c3aed" opacity=".18"/>
    <rect x="702" y="128" width="102" height="5" rx="2.5" fill="#7c3aed">
      <animate attributeName="width" values="0;0;102" keyTimes="0;0.39;1" dur="1.79s" fill="freeze"/>
    </rect>
  </g>
  <g>
    <rect x="918.75" y=".75" width="280.5" height="148.5" rx="26" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
    <circle cx="1160" cy="26" r="70" fill="#fef3c7" opacity=".9" clip-path="url(#c3)"/>
    <rect x="918" y="0" width="282" height="75.0" rx="26" fill="url(#sheen)" opacity=".7"/>
    <text x="1059.0" y="80" text-anchor="middle" class="n" fill="#d97706">8+</text>
    <text x="1059.0" y="110" text-anchor="middle" class="l">Projects built</text>
    <rect x="1008" y="128" width="102" height="5" rx="2.5" fill="#d97706" opacity=".18"/>
    <rect x="1008" y="128" width="102" height="5" rx="2.5" fill="#d97706">
      <animate attributeName="width" values="0;0;102" keyTimes="0;0.51;1" dur="1.91s" fill="freeze"/>
    </rect>
  </g>
  <g clip-path="url(#all)">
    <rect x="-280" y="-150" width="140" height="450" fill="url(#gloss)" transform="skewX(-20)">
      <animate attributeName="x" values="-280;1480;1480" keyTimes="0;.45;1" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
