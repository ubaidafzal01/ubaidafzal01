      <animate attributeName="width" values="0;0;102" keyTimes="0;0.15;1" dur="1.55s" fill="freeze"/>
    </rect>
  </g>
  <g>
    <rect x="306.75" y=".75" width="280.5" height="148.5" rx="26" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
    <circle cx="548" cy="26" r="70" fill="#dcfce7" opacity=".9" clip-path="url(#c1)"/>
    <rect x="306" y="0" width="282" height="75.0" rx="26" fill="url(#sheen)" opacity=".7"/>
    <text x="447.0" y="80" text-anchor="middle" class="n" fill="#16a34a">2+</text>
    <text x="447.0" y="110" text-anchor="middle" class="l">Years coding</text>
    <rect x="396" y="128" width="102" height="5" rx="2.5" fill="#16a34a" opacity=".18"/>
