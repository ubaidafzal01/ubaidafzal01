<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="3rd semester at FAST, 2+ years coding, 150+ problems solved, 8+ projects built">
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .n { font-size: 46px; font-weight: 800; letter-spacing: -1px; }
    .l { font-size: 16px; fill: #71717a; }
  </style>
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#e4e4e7"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <clipPath id="c0"><rect x="0" y="0" width="282" height="150" rx="26"/></clipPath>
    <clipPath id="c1"><rect x="306" y="0" width="282" height="150" rx="26"/></clipPath>
    <clipPath id="c2"><rect x="612" y="0" width="282" height="150" rx="26"/></clipPath>
    <clipPath id="c3"><rect x="918" y="0" width="282" height="150" rx="26"/></clipPath>
    <clipPath id="all"><rect x="0" y="0" width="282" height="150" rx="26"/><rect x="306" y="0" width="282" height="150" rx="26"/><rect x="612" y="0" width="282" height="150" rx="26"/><rect x="918" y="0" width="282" height="150" rx="26"/></clipPath>
  </defs>
  <g>
    <rect x="0.75" y=".75" width="280.5" height="148.5" rx="26" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
    <circle cx="242" cy="26" r="70" fill="#ccfbf1" opacity=".9" clip-path="url(#c0)"/>
    <rect x="0" y="0" width="282" height="75.0" rx="26" fill="url(#sheen)" opacity=".7"/>
    <text x="141.0" y="80" text-anchor="middle" class="n" fill="#0f766e">3rd</text>
    <text x="141.0" y="110" text-anchor="middle" class="l">Semester at FAST</text>
    <rect x="90" y="128" width="102" height="5" rx="2.5" fill="#0f766e" opacity=".18"/>
